version: "3.9"

# fraudguard demo - production-ready POC.
# 2 services orchestrated:
#   - fraudguard (Next.js frontend on host port 3034)
#   - fraudguard-backend (FastAPI Python, internal only on 8000)
# Shared external network wkdemo-net (created once by deploy.yml) avoids
# Docker default address-pool exhaustion across all 47 LP stacks.

services:
  fraudguard-backend:
    image: ghcr.io/wikolabs/fraudguard-backend:latest
    container_name: fraudguard-backend
    restart: unless-stopped
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    networks:
      - wkdemo_net

  fraudguard:
    image: ghcr.io/wikolabs/fraudguard:latest
    container_name: fraudguard
    restart: unless-stopped
    ports:
      - "3034:3000"
    environment:
      BACKEND_URL: "http://fraudguard-backend:8000"
    depends_on:
      - fraudguard-backend
    networks:
      - wkdemo_net

networks:
  wkdemo_net:
    name: wkdemo-net
    external: true
